<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b1a">
<title>Semah Souabni — IT Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b1a;--ink:#eef1ff;--mut:#9aa3c7;--a:#6d7bff;--b:#22d3c5;--c:#b794ff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--ink);background:var(--bg);overflow-x:hidden;display:grid;place-items:center;
padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom))}
.grid{position:fixed;inset:0;z-index:0;background-image:linear-gradient(rgba(109,123,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(109,123,255,.07) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(circle at 50% 40%,#000 20%,transparent 75%);mask-image:radial-gradient(circle at 50% 40%,#000 20%,transparent 75%)}
.orb{position:fixed;border-radius:50%;filter:blur(80px);opacity:.5;z-index:0;animation:float 14s ease-in-out infinite}
.o1{width:380px;height:380px;background:var(--a);top:-120px;left:-100px}
.o2{width:340px;height:340px;background:var(--b);bottom:-120px;right:-80px;animation-delay:-5s;opacity:.38}
.o3{width:260px;height:260px;background:var(--c);top:45%;left:55%;animation-delay:-9s;opacity:.3}
@keyframes float{50%{transform:translate(30px,-40px) scale(1.12)}}
.card{position:relative;z-index:1;width:min(480px,100%);padding:44px 30px 34px;border-radius:32px;text-align:center;
background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.14);
-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);box-shadow:0 30px 80px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.18);
animation:rise 1s cubic-bezier(.2,.9,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(30px) scale(.97)}}
.mark{width:68px;height:68px;margin:0 auto 22px;filter:drop-shadow(0 0 14px rgba(109,123,255,.7))}
.mark path{fill:none;stroke:url(#g);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:300;stroke-dashoffset:300;animation:draw 1.8s .3s ease forwards}
.mark circle{fill:#fff;animation:pulse 2.2s infinite}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes pulse{50%{opacity:.45}}
.status{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:30px;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--b);background:rgba(34,211,197,.1);border:1px solid rgba(34,211,197,.25);margin-bottom:18px}
.status i{width:7px;height:7px;border-radius:50%;background:var(--b);animation:ping 1.8s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(34,211,197,.7)}100%{box-shadow:0 0 0 9px transparent}}
h1{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(2.1rem,9vw,2.9rem);line-height:1.05;letter-spacing:-.01em;
background:linear-gradient(100deg,#fff,var(--a),var(--b),var(--c),#fff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 8s linear infinite}
@keyframes flow{to{background-position:300% 0}}
.role{margin-top:10px;color:var(--mut);font-size:1rem}
.q{margin:34px 0 22px;font-family:'Syne',sans-serif;font-size:1.3rem;font-weight:700}
.q small{display:block;margin-top:6px;font:400 .92rem 'DM Sans',sans-serif;color:var(--mut)}
.btns{display:grid;gap:14px}
.btn{--mx:50%;--my:50%;position:relative;overflow:hidden;display:flex;align-items:center;gap:16px;padding:18px 20px;border-radius:20px;text-align:left;color:var(--ink);text-decoration:none;
background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);transition:transform .35s cubic-bezier(.2,.9,.3,1),border-color .35s,box-shadow .35s}
.btn::before{content:"";position:absolute;inset:0;background:radial-gradient(220px circle at var(--mx) var(--my),var(--glow),transparent 70%);opacity:0;transition:opacity .35s}
.btn:hover,.btn:focus-visible{transform:translateY(-4px);border-color:var(--bc);box-shadow:0 14px 40px var(--sh);outline:none}
.btn:hover::before,.btn:focus-visible::before{opacity:1}
.btn:active{transform:translateY(-1px) scale(.99)}
.p{--glow:rgba(109,123,255,.4);--bc:rgba(109,123,255,.8);--sh:rgba(109,123,255,.35)}
.w{--glow:rgba(37,211,102,.35);--bc:rgba(37,211,102,.8);--sh:rgba(37,211,102,.28)}
.ic{position:relative;flex:none;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;color:#fff}
.p .ic{background:linear-gradient(135deg,var(--a),var(--c));box-shadow:0 8px 20px rgba(109,123,255,.45)}
.w .ic{background:linear-gradient(135deg,#25d366,#128c7e);box-shadow:0 8px 20px rgba(37,211,102,.4)}
.ic svg{width:26px;height:26px}
.tx{position:relative;flex:1;font-weight:700;font-size:1.02rem;line-height:1.3}
.tx small{display:block;margin-top:2px;font-weight:400;font-size:.82rem;color:var(--mut)}
.ar{position:relative;flex:none;width:22px;height:22px;color:var(--mut);transition:transform .35s,color .35s}
.btn:hover .ar{transform:translateX(5px);color:#fff}
.foot{margin-top:26px;font-size:.78rem;color:var(--mut);opacity:.8}
@media(max-width:420px){.card{padding:36px 20px 28px;border-radius:26px}.btn{padding:16px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition:none!important}}
.av{position:relative;width:116px;height:116px;margin:0 auto 24px}.av::before{content:"";position:absolute;inset:-5px;border-radius:50%;background:conic-gradient(var(--a),var(--b),var(--c),var(--a));box-shadow:0 0 28px rgba(109,123,255,.6);animation:spin 5s linear infinite}.av img{position:relative;width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;border:4px solid var(--bg)}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
